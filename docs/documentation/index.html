<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to pyCub Studio Handbook</title>
  <meta http-equiv="refresh" content="0; url=../handbook/index.html">
  <link rel="canonical" href="../handbook/index.html">
  <script>
    (function () {
      var url = new URL(window.location.href);
      if (!url.pathname.endsWith("/index.html") && !url.pathname.endsWith("/")) {
        url.pathname += "/";
      }
      var target = new URL("../handbook/index.html", url);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>The pyCub documentation has moved to the <a href="../handbook/index.html">pyCub Studio Handbook</a>.</p>
</body>
</html>
